<!doctype html>

<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1"/>
		<meta name="text-scale" content="scale" />

		<script>
			try {
				var palette = localStorage.getItem('treatsai-palette');
				if (palette) {
					var palettes = {
						'midnight-paws': { bg: '#0F0F1A', surface: '#1A1A2E', border: '#2D2D4A', primary: '#7C3AED', accent: '#F59E0B' },
						'ocean-whisker': { bg: '#0A1628', surface: '#0F2040', border: '#1A3A5C', primary: '#0EA5E9', accent: '#06B6D4' },
						'forest-purr':   { bg: '#0A1A0F', surface: '#0F2A18', border: '#1A3A24', primary: '#059669', accent: '#84CC16' },
						'sakura-meow':   { bg: '#1A0A14', surface: '#2A1020', border: '#3A1A2E', primary: '#EC4899', accent: '#F43F5E' },
						'golden-tabby':  { bg: '#1A1200', surface: '#2A1E00', border: '#3A2E00', primary: '#D97706', accent: '#FBBF24' },
						'arctic-fox':    { bg: '#0F172A', surface: '#1E2A3A', border: '#2A3A4A', primary: '#64748B', accent: '#38BDF8' }
					};
					var p = palettes[palette];
					if (p) {
						var r = document.documentElement;
						r.style.setProperty('--color-bg', p.bg);
						r.style.setProperty('--color-surface', p.surface);
						r.style.setProperty('--color-border', p.border);
						r.style.setProperty('--color-primary', p.primary);
						r.style.setProperty('--color-accent', p.accent);
					}
				}
			} catch(e) {}
		</script>

		<link rel="manifest" href="/manifest.json" />
		<meta name="theme-color" content="#7C3AED" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="TreatsAI" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/favicon.svg" />
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover"><div style="display: contents">%sveltekit.body%</div></body>
</html>
